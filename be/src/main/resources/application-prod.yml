server:
  port: 8080

# Mã dùng để mở "tủ ảnh" - đổi giá trị này, không commit mã thật lên git công khai
manager:
  code: ${SECRET-CODE:1234}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

 
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:anime}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:184703}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
 